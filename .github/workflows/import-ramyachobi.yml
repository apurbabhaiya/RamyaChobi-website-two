name: Import RamyaChobi source

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-ramyachobi.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout new repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Download original RamyaChobi source
        run: git clone --depth 1 https://github.com/apurbabhaiya/Apurba-Roy.git "$RUNNER_TEMP/ramyachobi-source"

      - name: Copy complete application without old workflow automation
        run: |
          rsync -a --exclude='.git/' --exclude='.github/workflows/' "$RUNNER_TEMP/ramyachobi-source/" ./
          # Prevent the copied website's admin route from redirecting into the old deployment.
          cat > vercel.json <<'JSON'
          {
            "$schema": "https://openapi.vercel.sh/vercel.json",
            "rewrites": [
              { "source": "/(.*)", "destination": "/index.html" }
            ]
          }
          JSON
          test -f package.json
          test -f src/RouterApp.tsx
          test -f supabase/config.toml || test -d supabase

      - name: Commit imported project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No new source changes"
            exit 0
          fi
          git commit -m "Import RamyaChobi source and remove old deployment redirect"
          git push origin HEAD:main
